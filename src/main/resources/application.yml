spring:
  application:
    name: gde-benz
  config:
    # Load local secrets from .env (KEY=VALUE, read as a properties file). Optional: in prod the
    # values come from real environment variables instead, so a missing .env is not an error.
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gdebenz}
    username: ${SPRING_DATASOURCE_USERNAME:gdebenz}
    password: ${SPRING_DATASOURCE_PASSWORD:gdebenz}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping against it.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true

telegram:
  bot:
    # Provide the token via the TELEGRAM_BOT_TOKEN environment variable (never commit real tokens).
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}

gdebenz:
  registration:
    # How long a rejected user must wait before /register is accepted again.
    reject-cooldown: ${GDEBENZ_REJECT_COOLDOWN:30m}
  api:
    # gdebenz.ru/api/nearby query defaults (base-url/user-agent/referer defaulted in code).
    radius-km: ${GDEBENZ_RADIUS_KM:10}
    max-results: ${GDEBENZ_MAX_RESULTS:10}
    cache-ttl: ${GDEBENZ_CACHE_TTL:60s}
  tbank:
    # Supplementary T-Bank Toplivo source (base-url/ca-resource defaulted in code).
    enabled: ${GDEBENZ_TBANK_ENABLED:true}
    radius-km: ${GDEBENZ_TBANK_RADIUS_KM:10}
    match-radius-meters: ${GDEBENZ_TBANK_MATCH_M:120}

logging:
  level:
    org.telegram: INFO
    ru.gdebenz: INFO
